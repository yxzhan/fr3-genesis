[project]
name = "fr3-genesis"
version = "0.1.0"
description = "Genesis examples for the mobile_fr3_duo dual-arm mobile robot (pick-and-place / keyboard control / scene display)"
readme = "README.md"
# genesis-world supports 3.10–3.12
requires-python = ">=3.10,<3.13"

dependencies = [
    "genesis-world==0.4.6",
    "pynput",
    "numpy",
    "ipywidgets",
    "sidecar",
    "tqdm",
]

# Install exactly one PyTorch extra for your hardware (mutually exclusive, see
# [tool.uv] below). genesis-world depends on torch itself; [tool.uv.sources]
# redirects torch to the matching official PyTorch wheel index per hardware.
[project.optional-dependencies]
cpu = ["torch"]
cu126 = ["torch"]
rocm = ["torch"]

# CLI entry point: runs the demo (RobotScene + smoke test).
[project.scripts]
fr3-genesis = "fr3_genesis:main"

# ---- packaging --------------------------------------------------------------
# Build a real, pip-installable package. The runnable module lives in scripts/ and
# the assets at the repo root; hatch maps both into the fr3_genesis package inside
# the built wheel (force-include), so the source tree layout is left untouched.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fr3_genesis"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/scene_robot_tables.py" = "fr3_genesis/scene_robot_tables.py"
"assets" = "fr3_genesis/assets"

# Same mapping for the source distribution so `assets/` ships in the sdist too.
[tool.hatch.build.targets.sdist.force-include]
"scripts/scene_robot_tables.py" = "fr3_genesis/scene_robot_tables.py"
"assets" = "fr3_genesis/assets"

# ipykernel is needed to register the venv as a Jupyter kernel (notebooks / Binder).
# It lives in the default-installed "dev" group so `uv sync` keeps it instead of
# pruning it — installing it out-of-band with `uv pip install` does not survive a
# later `uv sync`.
[dependency-groups]
dev = ["ipykernel", "pytest"]

# Pytest: when ROS is sourced, /opt/ros/.../site-packages is on PYTHONPATH and its
# pytest11 entry-points autoload into our venv; launch_testing/launch_ros fail to
# import (missing `lark`). Disable just those so `uv run pytest` works as-is.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:launch_testing -p no:launch_ros"

[tool.uv]
# Pick one of cpu / cu126 / rocm; installing more than one is disallowed.
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "rocm" },
    ],
]

# Point torch at the matching PyTorch index based on the selected extra.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]

# explicit = true: these indexes are only used when explicitly referenced in
# [tool.uv.sources], so they don't affect resolution of other packages.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
